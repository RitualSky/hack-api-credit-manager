name: CI/CD Azure

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      change_risk:
        description: "Complejidad/impacto del cambio (low = pase automatizado calendarizado, high = aprobación humana)"
        type: choice
        options: [low, high]
        default: high
      scheduled_at:
        description: "Solo si low: fecha/hora UTC del pase a producción (ej. 2026-11-14T02:00:00Z)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  CERT_URL: ${{ vars.CERT_URL }}
  JIRA_PROJECT_KEY: SCRUM

jobs:
  jira-init:
    name: Crear issue padre en Jira
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      issue_key: ${{ steps.create.outputs.issue_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Crear issue padre
        id: create
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_TRACKING_DISABLED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && secrets.JIRA_EMAIL == '' && secrets.JIRA_API_TOKEN == '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js create-parent

  build:
    name: Build
    needs: jira-init
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Crear subtarea Jira
        id: jira_subtask
        if: needs.jira-init.outputs.issue_key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Build
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js start-subtask
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: target/*.jar
          if-no-files-found: error
      - name: Registrar resultado en Jira
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira_subtask.outputs.issue_key }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Build
          JOB_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_ARTIFACTS: app-package
        run: node .github/scripts/jira.js finish-subtask

  test:
    name: Pruebas unitarias
    needs: [build, jira-init]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Crear subtarea Jira
        id: jira_subtask
        if: needs.jira-init.outputs.issue_key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Pruebas unitarias
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js start-subtask
      - name: Instalar dependencias de pruebas JavaScript
        run: npm ci --ignore-scripts
      - name: Pruebas Jira con cobertura total
        run: npm run test:jira
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Test y cobertura
        run: mvn -B verify
      - name: Reporte HTML de pruebas tras fallo
        if: failure()
        continue-on-error: true
        run: mvn -B surefire-report:report-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            target/surefire-reports
            target/reports/surefire.html
      - name: Registrar resultado en Jira
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira_subtask.outputs.issue_key }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Pruebas unitarias
          JOB_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_ARTIFACTS: javascript-coverage, unit-test-reports
        run: node .github/scripts/jira.js finish-subtask

  sonarcloud:
    name: SonarCloud
    needs: [test, jira-init]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: javascript-coverage
          path: coverage
      - name: Crear subtarea Jira
        id: jira_subtask
        if: needs.jira-init.outputs.issue_key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: SonarCloud
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js start-subtask
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Análisis SonarCloud
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'ritualsky' }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'RitualSky_hack-api-credit-manager' }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization="$SONAR_ORGANIZATION"
          -Dsonar.projectKey="$SONAR_PROJECT_KEY"
          -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
          -Dsonar.exclusions="**/*.test.js"
          -Dsonar.coverage.exclusions="**/*.test.js"
          -Dsonar.qualitygate.wait=true
      - name: Detalle de condiciones fallidas del Quality Gate
        if: failure() && steps.sonar.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'RitualSky_hack-api-credit-manager' }}
          SONAR_BRANCH: ${{ github.event_name == 'pull_request' && '' || github.ref_name }}
          SONAR_PR: ${{ github.event_name == 'pull_request' && github.event.number || '' }}
        run: |
          args=(--data-urlencode "projectKey=$SONAR_PROJECT_KEY")
          [ -n "$SONAR_BRANCH" ] && args+=(--data-urlencode "branch=$SONAR_BRANCH")
          [ -n "$SONAR_PR" ] && args+=(--data-urlencode "pullRequest=$SONAR_PR")
          curl -sS -G -u "$SONAR_TOKEN:" "${args[@]}" https://sonarcloud.io/api/qualitygates/project_status \
            | jq -r '.projectStatus | "Quality Gate: \(.status)", (.conditions[]? | select(.status != "OK") | "- \(.metricKey): \(.status) (valor=\(.actualValue // "sin datos"), umbral \(.comparator) \(.errorThreshold))")'
      - name: Registrar resultado en Jira
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira_subtask.outputs.issue_key }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: SonarCloud
          JOB_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js finish-subtask

  security-tool:
    name: Herramienta de seguridad
    needs: [test, jira-init]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Crear subtarea Jira
        id: jira_subtask
        if: needs.jira-init.outputs.issue_key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Herramienta de seguridad
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js start-subtask
      - name: Escaneo de seguridad (placeholder)
        run: echo "TODO - reemplazar por la herramienta de seguridad corporativa (SCA/SAST)."
      - name: Registrar resultado en Jira
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira_subtask.outputs.issue_key }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Herramienta de seguridad
          STAGE_NOTE: Este job es un placeholder; el escaneo SCA se ejecuta en Snyk Security Check y no hay SAST configurado.
          JOB_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js finish-subtask

  snyk-sca:
    name: Snyk Security Check
    needs: [security-tool, jira-init]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Crear subtarea Jira
        id: jira_subtask
        if: needs.jira-init.outputs.issue_key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Snyk Security Check
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js start-subtask
      - uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
        with:
          snyk-version: v1.1308.4
      - name: Analizar dependencias Maven y npm con Snyk
        id: snyk_scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high --dev --json-file-output=snyk-sca-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-sca-reports
          path: snyk-sca-report.json
          if-no-files-found: warn
      - name: Bloquear el pipeline si Snyk falla
        if: steps.snyk_scan.outcome != 'success'
        run: |
          echo "::error::Snyk encontró vulnerabilidades altas/críticas o no pudo completar el análisis."
          exit 1
      - name: Registrar resultado en Jira
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira_subtask.outputs.issue_key }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Snyk Security Check
          JOB_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_ARTIFACTS: snyk-sca-reports
        run: node .github/scripts/jira.js finish-subtask

  # El PR ejecuta CI; los escaneos DAST se reservan para push o ejecución manual.
  owasp-zap:
    name: OWASP ZAP baseline
    needs: [sonarcloud, snyk-sca, jira-init]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Crear subtarea Jira
        id: jira_subtask
        if: needs.jira-init.outputs.issue_key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: OWASP ZAP baseline
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js start-subtask
      # - uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
      #   with:
      #     target: ${{ env.CERT_URL }}
      #     allow_issue_writing: false
      #     fail_action: false
      #     artifact_name: zap-baseline-report
      - name: Registrar resultado en Jira
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira_subtask.outputs.issue_key }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: OWASP ZAP baseline
          STAGE_NOTE: La acción de escaneo está comentada; no se generó reporte ZAP.
          JOB_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js finish-subtask

  dast:
    name: DAST (ethical hacking)
    needs: [sonarcloud, snyk-sca, jira-init]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Crear subtarea Jira
        id: jira_subtask
        if: needs.jira-init.outputs.issue_key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: DAST
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js start-subtask
      #Solo contra el ambiente de certificación autorizado (CERT_URL)
      # - uses: zaproxy/action-full-scan@75ee1686750ab1511a73b26b77a2aedd295053ed # v0.12.0
      #   with:
      #     target: ${{ env.CERT_URL }}
      #     allow_issue_writing: false
      #     fail_action: false
      #     artifact_name: zap-full-scan-report
      - name: Registrar resultado en Jira
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira_subtask.outputs.issue_key }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: DAST
          STAGE_NOTE: La acción full-scan está comentada; no se generó reporte DAST.
          JOB_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js finish-subtask

  deploy-cert:
    name: Despliegue Web App (certificación)
    needs: [owasp-zap, dast, jira-init]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: certification
      url: ${{ vars.CERT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Crear subtarea Jira
        id: jira_subtask
        if: needs.jira-init.outputs.issue_key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Despliegue certificación
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js start-subtask
      - uses: actions/download-artifact@v4
        with:
          name: app-package
          path: package
      # - uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
      #   with:
      #     app-name: ${{ vars.AZURE_WEBAPP_CERT_NAME }}
      #     publish-profile: ${{ secrets.AZURE_WEBAPP_CERT_PUBLISH_PROFILE }}
      #     package: package/*.jar
      - name: Registrar resultado en Jira
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira_subtask.outputs.issue_key }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Despliegue certificación
          STAGE_NOTE: El paso azure/webapps-deploy está comentado; no se ejecutó el despliegue.
          JOB_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js finish-subtask

  functional-tests:
    name: Pruebas funcionales (Karate)
    needs: [deploy-cert, jira-init]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Crear subtarea Jira
        id: jira_subtask
        if: needs.jira-init.outputs.issue_key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Pruebas funcionales Karate
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js start-subtask
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Ejecutar Karate
        run: mvn -B test -Pkarate -Dkarate.options="--tags @functional" -Dkarate.env=cert -DbaseUrl="${{ env.CERT_URL }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-reports
          path: target/karate-reports
      - name: Registrar resultado en Jira
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira_subtask.outputs.issue_key }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Pruebas funcionales Karate
          JOB_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_ARTIFACTS: karate-reports
        run: node .github/scripts/jira.js finish-subtask

  functional-report:
    name: Reporte de pruebas funcionales
    needs: [functional-tests, jira-init]
    if: always() && needs.functional-tests.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Crear subtarea Jira
        id: jira_subtask
        if: needs.jira-init.outputs.issue_key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Reporte funcional
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js start-subtask
      - name: Resumen
        run: |
          echo "## Reporte funcional (Karate)" >> "$GITHUB_STEP_SUMMARY"
          echo "Resultado: ${{ needs.functional-tests.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Reporte HTML en el artefacto karate-reports." >> "$GITHUB_STEP_SUMMARY"
      - name: Continuar solo si pasaron
        if: needs.functional-tests.result != 'success'
        run: |
          echo "Pruebas funcionales fallidas; se detiene el pipeline."
          exit 1
      - name: Registrar resultado en Jira
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira_subtask.outputs.issue_key }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Reporte funcional
          JOB_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_ARTIFACTS: karate-reports
        run: node .github/scripts/jira.js finish-subtask

  performance:
    name: Pruebas de performance (k6)
    needs: [functional-report, jira-init]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Crear subtarea Jira
        id: jira_subtask
        if: needs.jira-init.outputs.issue_key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Pruebas de performance k6
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js start-subtask
      - uses: actions/setup-java@v4
        if: env.CERT_URL == ''
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Sin CERT_URL (certificación no desplegada) se prueba la API levantada en el runner
      - name: Iniciar API local
        if: env.CERT_URL == ''
        run: |
          mvn -B -DskipTests package
          nohup java -jar target/quarkus-app/quarkus-run.jar > app.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs http://localhost:8080/api/v1/hello > /dev/null && exit 0
            sleep 1
          done
          cat app.log
          exit 1
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1
      - name: Ejecutar k6
        env:
          BASE_URL: ${{ env.CERT_URL || 'http://localhost:8080' }}
        run: k6 run --summary-export=k6-summary.json -e BASE_URL="$BASE_URL" tests/performance/load.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: k6-summary.json
      - name: Registrar resultado en Jira
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira_subtask.outputs.issue_key }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Pruebas de performance k6
          JOB_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_ARTIFACTS: k6-summary
        run: node .github/scripts/jira.js finish-subtask

  # Pase a producción: bajo riesgo => calendarizado automático; alto => aprobación humana
  release-scheduled:
    name: Pase automatizado calendarizado
    needs: [performance, jira-init]
    if: github.event_name == 'workflow_dispatch' && inputs.change_risk == 'low'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production-scheduled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Crear subtarea Jira
        id: jira_subtask
        if: needs.jira-init.outputs.issue_key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Pase automatizado calendarizado
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js start-subtask
      - name: Esperar fecha/hora programada
        env:
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: |
          if [ -z "$SCHEDULED_AT" ]; then echo "Sin fecha: se ejecuta de inmediato."; exit 0; fi
          wait=$(( $(date -u -d "$SCHEDULED_AT" +%s) - $(date -u +%s) ))
          if [ "$wait" -gt 18000 ]; then
            echo "::error::Máximo 5 h de espera en el runner. Para esperas mayores usa un wait timer en el environment production-scheduled."
            exit 1
          fi
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
      - name: Registrar resultado en Jira
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira_subtask.outputs.issue_key }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Pase automatizado calendarizado
          JOB_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js finish-subtask

  release-approval:
    name: Aprobación humana para producción
    needs: [performance, jira-init]
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.change_risk != 'low')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Configurar required reviewers en este environment
    environment: production-approval
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Crear subtarea Jira
        id: jira_subtask
        if: needs.jira-init.outputs.issue_key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Aprobación humana para producción
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js start-subtask
      - run: echo "Aprobado por un revisor humano."
      - name: Registrar resultado en Jira
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira_subtask.outputs.issue_key }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Aprobación humana para producción
          JOB_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js finish-subtask

  deploy-prod:
    name: Despliegue Azure (producción)
    needs: [release-scheduled, release-approval, jira-init]
    if: >
      always() && !cancelled() &&
      (needs.release-scheduled.result == 'success' || needs.release-approval.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Crear subtarea Jira
        id: jira_subtask
        if: needs.jira-init.outputs.issue_key != ''
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Despliegue producción
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js start-subtask
      # - uses: actions/download-artifact@v4
      #   with:
      #     name: app-package
      #     path: package
      # - uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
      #   with:
      #     app-name: ${{ vars.AZURE_WEBAPP_PROD_NAME }}
      #     publish-profile: ${{ secrets.AZURE_WEBAPP_PROD_PUBLISH_PROFILE }}
      #     package: package/*.jar
      - name: Registrar resultado en Jira
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira_subtask.outputs.issue_key }}
          JIRA_PARENT_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JIRA_JOB_NAME: Despliegue producción
          STAGE_NOTE: El paso azure/webapps-deploy está comentado; no se ejecutó el despliegue.
          JOB_RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js finish-subtask

  jira-finalize:
    name: Finalizar issue padre en Jira
    needs:
      - jira-init
      - build
      - test
      - sonarcloud
      - security-tool
      - snyk-sca
      - owasp-zap
      - dast
      - deploy-cert
      - functional-tests
      - functional-report
      - performance
      - release-scheduled
      - release-approval
      - deploy-prod
    if: always() && needs.jira-init.result == 'success' && needs.jira-init.outputs.issue_key != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Registrar resultado final en Jira
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ needs.jira-init.outputs.issue_key }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira.js finish-parent
